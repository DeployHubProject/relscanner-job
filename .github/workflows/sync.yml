name: Sync Upstream

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          # Set this to the branch you want to sync (e.g., main or master)
          ref: main 
          persist-credentials: false

      - name: Sync upstream changes
        uses: repo-sync/github-sync@v2
        with:
          # Format: owner/repository
          upstream_repository: "ortelius/relscanner-job"
          # The upstream branch you want to sync from
          target_repository_branch: "main"
          # The local branch you want to sync to
          target_branch: "main"
          # GitHub automatically provides this token
          github_token: ${{ secrets.GITHUB_TOKEN }}
